{% extends "base.html" %}

{% block title %}
Prediction
{% endblock title %}

{% block body %}
<section class="py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-7">
        <div class="card shadow-lg rounded-4 border-0">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <i class="bi bi-calculator-fill fs-1 text-primary"></i>
              <h3 class="fw-bold mt-2">Predict Insurance Premium</h3>
              <p class="text-muted small">Enter the details below and get your predicted premium instantly.</p>
            </div>

            {% if output %}
              <div class="alert alert-info mt-4 text-center">
                <strong>Predicted Premium:</strong> ₹ {{ output }}
              </div>
            {% endif %}

            <form method="POST" action="{% url 'prediction' %}">
              {% csrf_token %}

              <div class="row g-3">

                <div class="col-md-6 form-floating">
                  <input type="number" class="form-control" id="age" name="age" placeholder="Age" required>
                  <label for="age">Age</label>
                </div>

                <div class="col-md-6 form-floating">
                  <select class="form-select" id="sex" name="sex" required>
                    <option value="" selected disabled>Choose...</option>
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                  </select>
                  <label for="sex">Sex</label>
                </div>

                <div class="col-md-6 form-floating">
                  <input type="number" step="0.01" class="form-control" id="bmi" name="bmi" placeholder="BMI" required>
                  <label for="bmi">BMI</label>
                </div>

                <div class="col-md-6 form-floating">
                  <input type="number" class="form-control" id="children" name="children" placeholder="Children" required>
                  <label for="children">Number of Children</label>
                </div>

                <div class="col-md-6 form-floating">
                  <select class="form-select" id="smoker" name="smoker" required>
                    <option value="" selected disabled>Choose...</option>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                  </select>
                  <label for="smoker">Smoker</label>
                </div>

                <div class="col-md-6 form-floating">
                  <select class="form-select" id="region" name="region" required>
                    <option value="" selected disabled>Choose...</option>
                    <option value="1">Southwest</option>
                    <option value="2">Southeast</option>
                    <option value="3">Northwest</option>
                    <option value="4">Northeast</option> 
                  </select>
                  <label for="region">Region</label>
                </div>

              </div>

              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                  <i class="bi bi-graph-up-arrow me-2"></i> Predict Now
                </button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
