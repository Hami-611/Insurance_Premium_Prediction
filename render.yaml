services:
  - type: web
    name: insurance-premium-prediction
    env: python
    repo: https://github.com/Hami-611/Insurance_Premium_Prediction
    branch: main
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn insurance.wsgi:application
    envVars:
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: Postgres
          property: connectionString

databases:
  - name: Postgres
    plan: free
